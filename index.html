<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KhanaGo Admin Dashboard</title>
  <style>
    :root {
      --primary: #15803d;
      --primary-dark: #166534;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 40px; }
    header {
      background: var(--primary);
      color: #fff;
      padding: 18px 16px;
      text-align: center;
    }
    .container { max-width: 760px; margin: 20px auto; padding: 0 14px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; color: var(--muted); }
    .field input, .field select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
    }
    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: var(--primary-dark); }
    .btn-outline {
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 7px 12px;
      font-size: 0.88rem;
    }
    .hidden { display: none; }
    .msg { margin-top: 10px; font-size: 0.92rem; font-weight: 600; color: #dc2626; }
    .order-box {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
      background: #fafafa;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      background: #dcfce7;
      color: #166534;
    }
  </style>
</head>
<body>
  <header>
    <h1>🔒 KhanaGo Admin Dashboard</h1>
  </header>

  <div class="container">
    <div id="loginBox" class="card">
      <h2 style="margin-bottom:12px;">Admin Login</h2>
      <div class="field">
        <label>Admin Email</label>
        <input type="email" id="adminEmail" value="kishangihar8@gmail.com" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="adminPass" placeholder="Enter admin password" />
      </div>
      <button class="btn" onclick="adminLogin()">Admin Login</button>
      <div id="adminMsg" class="msg"></div>
    </div>

    <div id="dashboardContent" class="hidden">
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <h2>Live Orders</h2>
          <button class="btn-outline" onclick="adminLogout()">Logout</button>
        </div>
        <div id="ordersList">Loading orders...</div>
      </div>

      <div class="card">
        <h2 style="margin-bottom:12px;">Customer Help Messages</h2>
        <div id="helpsList">Loading messages...</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore, collection, onSnapshot, query, orderBy, updateDoc, doc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCfoYb2nBRXAmWggHV-d77qEywaMXXHI7Y",
      authDomain: "khanago-11584.firebaseapp.com",
      projectId: "khanago-11584",
      storageBucket: "khanago-11584.firebasestorage.app",
      messagingSenderId: "472974685789",
      appId: "1:472974685789:web:dc9affa20898ad2bf3ffb4",
      measurementId: "G-6EH5CP0VXM"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let unsubOrders = null;
    let unsubHelps = null;

    window.adminLogin = async () => {
      const email = document.getElementById("adminEmail").value.trim();
      const pass = document.getElementById("adminPass").value;
      const msgEl = document.getElementById("adminMsg");
      msgEl.textContent = "";
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        msgEl.textContent = "Login failed: " + err.message;
      }
    };

    window.adminLogout = async () => {
      await signOut(auth);
    };

    window.changeOrderStatus = async (orderId, newStatus) => {
      await updateDoc(doc(db, "orders", orderId), {
        status: newStatus,
        updatedAt: serverTimestamp()
      });
    };

    onAuthStateChanged(auth, (user) => {
      const loginBox = document.getElementById("loginBox");
      const dash = document.getElementById("dashboardContent");
      if (user) {
        loginBox.classList.add("hidden");
        dash.classList.remove("hidden");
        startListeners();
      } else {
        loginBox.classList.remove("hidden");
        dash.classList.add("hidden");
        if (unsubOrders) unsubOrders();
        if (unsubHelps) unsubHelps();
      }
    });

    function startListeners() {
      const qOrders = query(collection(db, "orders"), orderBy("createdAt", "desc"));
      unsubOrders = onSnapshot(qOrders, (snap) => {
        const el = document.getElementById("ordersList");
        if (snap.empty) {
          el.textContent = "No orders yet.";
          return;
        }
        el.innerHTML = snap.docs.map(d => {
          const o = d.data();
          const itemsStr = (o.items || []).map(i => `${i.name} x${i.qty}`).join(", ");
          const statuses = ["Order Placed","Preparing","Ready","Out for Delivery","Completed","Cancelled"];
          const opts = statuses.map(s => `<option value="${s}" ${o.status === s ? "selected" : ""}>${s}</option>`).join("");
          return `
            <div class="order-box">
              <div><strong>${o.name}</strong> (${o.phone}) — <span class="badge">${o.status}</span></div>
              <div><small>Shop: ${o.shop || "N/A"} | Address: ${o.address}</small></div>
              <div><small>Items: ${itemsStr} | Total: ₹${o.total}</small></div>
              <div style="margin-top:8px;">
                <select onchange="changeOrderStatus('${d.id}', this.value)">${opts}</select>
              </div>
            </div>
          `;
        }).join("");
      });

      const qHelps = query(collection(db, "helpMessages"), orderBy("createdAt", "desc"));
      unsubHelps = onSnapshot(qHelps, (snap) => {
        const el = document.getElementById("helpsList");
        if (snap.empty) {
          el.textContent = "No help messages yet.";
          return;
        }
        el.innerHTML = snap.docs.map(d => {
          const h = d.data();
          return `
            <div class="order-box">
              <div><strong>${h.name}</strong> (${h.phone})</div>
              <div style="margin-top:4px;">${h.message}</div>
            </div>
          `;
        }).join("");
      });
    }
  </script>
</body>
</html>
